<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GRIB Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/bulma@0.9.4/css/bulma.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    #map { height: 500px; margin-top: 1em; }
  </style>
</head>
<body>
  <section class="section">
    <div class="container">
      <h1 class="title">GRIB File Viewer</h1>
      <div class="box">
        <div class="field">
          <label class="label">Upload GRIB file</label>
          <div class="control">
            <input class="input" type="file" id="fileInput" />
          </div>
        </div>
        <div class="field" id="parameterField" style="display:none;">
          <label class="label">Select parameter</label>
          <div class="control">
            <div class="select">
              <select id="parameterSelect"></select>
            </div>
          </div>
        </div>
        <div class="field" id="timestampField" style="display:none;">
          <label class="label">Select Timestamp</label>
          <div class="control">
            <div class="select">
              <select id="timestampSelect"></select>
            </div>
          </div>
        </div>
        <div id="output"></div>
      </div>
      <div id="map"></div>
      <div id="wind-data" style="margin-top: 10px;"></div>
      <div id="zoom-level">Zoom Level: </div>
    </div>
  </section>
  <script type="module" src="./index.js"></script>
</body>
</html>

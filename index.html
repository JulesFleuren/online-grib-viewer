<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GRIB Viewer</title>
  <link rel="stylesheet" href="node_modules/bulma/css/bulma.min.css" />
  <link rel="stylesheet" href="node_modules/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="node_modules/leaflet.fullscreen/Control.FullScreen.css" />
  <script src="node_modules/leaflet/dist/leaflet.js"></script>
  <script src="node_modules/leaflet.fullscreen/Control.FullScreen.js"></script>
  <style>
    #map { height: 500px; margin-top: 1em; }
  </style>
</head>
<body>
  <section class="section">
    <div class="container">
      <h1 class="title">GRIB File Viewer</h1>
      <div class="box">
        <div class="field">
          <label class="label">Upload GRIB file</label>
          <div class="control">
            <input class="input" type="file" id="fileInput" />
          </div>
        </div>
        <div class="columns" id="parameterField" style="display:none;">
            <div class="column" id="vectorFieldParameterField">
                <label class="label">Select vector field parameter</label>
                <div class="control">
                    <div class="select">
                    <select id="vectorFieldParameterSelect"></select>
                    </div>
                </div>
            </div>
            <div class="column" id="heatmapParameterField">
                <label class="label">Select heat map parameter</label>
                <div class="control">
                    <div class="select">
                    <select id="heatMapParameterSelect"></select>
                    </div>
                </div>
            </div>
        </div>
        <div class="field" id="timestampField" style="display:none;">
          <label class="label">Select Timestamp</label>
          <div class="field is-grouped">
            <p class="control">
              <button class="button is-link" id="nowTimestampButton">Now</button>
            </p>
            <div class="control">
              <div class="select">
                <select id="timestampSelect"></select>
              </div>
            </div>
            <p class="control">
              <button class="button is-link" id="prevTimestampButton">&#8592;</button>
            </p>
            <p class="control">
              <button class="button is-link" id="nextTimestampButton">&#8594;</button>
            </p>
          </div>
        </div>
        <div id="output"></div>
      </div>
      <div id="map"></div>
      <div id="wind-data" style="margin-top: 10px;"></div>
      <div id="zoom-level">Zoom Level: </div>
    </div>
  </section>
  <script type="module" src="./src-ts/index.ts"></script>
</body>
</html>
